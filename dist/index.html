<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Wealth Watch · Spending Tracker</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Drop in your credit card or bank statements and see where your money goes. Everything runs in your browser.">
        <meta name="theme-color" content="#059669">
        <link rel="icon" type="image/png" href="images/budgetIcon1.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <script>
            try {
                var saved = JSON.parse(localStorage.getItem('wealth-watch:v1') || '{}').theme;
                var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.dataset.theme = dark ? 'dark' : 'light';
            } catch (e) {}
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script src="bundle.js"></script>
    </body>
</html>
